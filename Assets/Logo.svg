<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#2E0A4F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle tile -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#glow)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="56.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Download arrow: shaft + a "play" triangle turned to point down, resting on a tray -->
  <g filter="url(#shadow)" fill="#FFFFFF" stroke="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">
    <rect x="109" y="44" width="38" height="92" rx="19" stroke="none"/>
    <path d="M72 118 L184 118 L128 182 Z" stroke-width="22"/>
    <rect x="58" y="204" width="140" height="22" rx="11" stroke="none"/>
  </g>
</svg>
